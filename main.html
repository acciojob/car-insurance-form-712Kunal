<!DOCTYPE html>
<html>

<head>
	<link rel="stylesheet" href="styles.css">
</head>

<body>
	<form action="" method="post">

		<label for="name">Name</label>
		<input type="text" required id="name" placeholder="Name">

		<label for="email">Email</label>
		<input type="email" required id="email" placeholder="Email">

		<label>Gender</label>
		<input type="radio" required id="male" name="gender">
		<label for="male">Male</label>

		<input type="radio" required id="female" name="gender">
		<label for="female">Female</label>

		<label for="cars">Select Cars</label>
		<select multiple id="cars">
			<option>BMW</option>
			<option>Audi</option>
			<option>Mercedes</option>
		</select>

		<label for="carage">Car age</label>
		<input type="number" required id="carage">

		<label for="dop">Date of Purchase (DOP)</label>
		<input type="date" required id="dop">

		<label for="password">Password</label>
		<input type="password" required id="password" placeholder="Password">

		<button type="submit">Submit</button>

	</form>

	<script type="text/javascript" src="./script.js"></script>
</body>

</html>
